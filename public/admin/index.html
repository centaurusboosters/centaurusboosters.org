<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Centaurus Boosters Content Manager</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    (function () {
      var h = window.h;
      if (!window.CMS || !h) return;

      function toArray(value) {
        if (!value) return [];
        if (typeof value.toJS === "function") return value.toJS();
        return Array.isArray(value) ? value : [];
      }

      function sponsorCard(sponsor, index) {
        return h(
          "div",
          {
            key: sponsor.name || index,
            style: {
              background: "#fff",
              borderRadius: "4px",
              padding: "12px 16px",
              height: "84px",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              boxShadow: "0 1px 4px rgba(11, 24, 56, .08)"
            }
          },
          h("img", {
            src: sponsor.logo || "",
            alt: sponsor.alt || sponsor.name || "",
            style: {
              maxWidth: "100%",
              maxHeight: "56px",
              objectFit: "contain"
            }
          })
        );
      }

      CMS.registerPreviewTemplate("site_data", function SponsorDataPreview(props) {
        var sponsors = toArray(props.entry.getIn(["data", "items"])).filter(function (sponsor) {
          return sponsor && sponsor.enabled !== false;
        });

        return h(
          "div",
          {
            style: {
              minHeight: "100vh",
              background: "#f3f5fb",
              padding: "54px 6vw",
              fontFamily: "Arial, sans-serif"
            }
          },
          h(
            "div",
            {
              style: {
                textAlign: "center",
                color: "#0b1838",
                fontWeight: 800,
                fontSize: "13px",
                letterSpacing: ".18em",
                marginBottom: "26px"
              }
            },
            "PROUDLY SUPPORTED BY OUR SPONSORS"
          ),
          h(
            "div",
            {
              style: {
                display: "grid",
                gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))",
                gap: "16px"
              }
            },
            sponsors.length
              ? sponsors.map(sponsorCard)
              : h(
                  "div",
                  {
                    style: {
                      color: "#55585f",
                      textAlign: "center",
                      gridColumn: "1 / -1"
                    }
                  },
                  "No enabled sponsors to preview."
                )
          )
        );
      });
    })();
  </script>
</body>
</html>
