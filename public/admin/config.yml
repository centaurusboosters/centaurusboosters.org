backend:
  name: github
  repo: kurtharriger/2026-boosters
  branch: main
  site_domain: gilded-genie-b2528a.netlify.app
  squash_merges: true

publish_mode: editorial_workflow

media_folder: "public/assets"
public_folder: "assets"

collections:
  - name: "site_data"
    label: "Site Data"
    files:
      - name: "sponsors"
        label: "Sponsors"
        file: "src/data/sponsors.json"
        format: "json"
        fields:
          - label: "Sponsors"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image" }
              - { label: "Alt text", name: "alt", widget: "string" }
              - { label: "Enabled", name: "enabled", widget: "boolean", default: true }

      - name: "tournament"
        label: "Tournament Details"
        file: "src/data/tournament.json"
        format: "json"
        fields:
          - { label: "Edition", name: "edition", widget: "string" }
          - { label: "Date", name: "date", widget: "string" }
          - { label: "Time", name: "time", widget: "string" }
          - { label: "Venue", name: "venue", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
          - { label: "Price per player ($)", name: "price_player", widget: "number" }
          - { label: "Price per foursome ($)", name: "price_foursome", widget: "number" }
          - { label: "Holes", name: "holes", widget: "number" }
          - { label: "Format", name: "format", widget: "string" }
          - { label: "Format label", name: "format_label", widget: "string" }
          - label: "Inclusions"
            name: "inclusions"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }
          - label: "Event-day add-ons"
            name: "add_ons"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }
          - { label: "Auction description", name: "auction_description", widget: "text" }
          - { label: "Section headline", name: "section_headline", widget: "string" }
          - { label: "Section intro", name: "section_intro", widget: "text" }
          - { label: "Course description", name: "course_description", widget: "text" }
          - { label: "Register headline", name: "register_headline", widget: "string" }
          - { label: "Register intro", name: "register_intro", widget: "text" }
          - { label: "Arrive by", name: "arrive_by", widget: "string" }

      - name: "contacts"
        label: "Contacts"
        file: "src/data/contacts.json"
        format: "json"
        fields:
          - label: "Players contact"
            name: "players"
            widget: "object"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
          - label: "Sponsorship contacts"
            name: "sponsorship"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }

      - name: "site_data_sponsor_benefits"
        label: "Sponsor Benefits"
        file: "src/data/sponsor-benefits.json"
        format: "json"
        fields:
          - label: "Benefits"
            name: "items"
            widget: "list"

      - name: "site_data_get_involved"
        label: "Get Involved Cards"
        file: "src/data/get-involved.json"
        format: "json"
        fields:
          - label: "Cards"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Link label", name: "link_label", widget: "string", required: false }
              - { label: "Form key", name: "form", widget: "string", required: false }
              - { label: "Form title", name: "form_title", widget: "string", required: false }
              - { label: "Coming soon", name: "coming_soon", widget: "boolean", default: false, required: false }

      - name: "site"
        label: "Site Content"
        file: "src/data/site.json"
        format: "json"
        fields:
          - { label: "Copyright line", name: "copyright", widget: "string" }
          - label: "Social links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Facebook URL", name: "facebook", widget: "string" }
          - label: "Hero — Mission slide"
            name: "hero_mission"
            widget: "object"
            fields:
              - { label: "Badge text", name: "badge", widget: "string" }
              - { label: "Headline line 1", name: "headline_line1", widget: "string" }
              - { label: "Headline line 2 (before accent)", name: "headline_line2", widget: "string" }
              - { label: "Headline accent word (red)", name: "headline_accent", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
          - label: "Donate section"
            name: "donate"
            widget: "object"
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
          - label: "Sponsor CTA section"
            name: "sponsor_cta"
            widget: "object"
            fields:
              - { label: "Headline line 1", name: "headline_line1", widget: "string" }
              - { label: "Headline line 2", name: "headline_line2", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }

  - name: "content"
    label: "Page Content"
    files:
      - name: "about"
        label: "About / Mission"
        file: "src/content/about/index.mdx"
        format: "frontmatter"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - name: "grants_team"
        label: "Team Grants"
        file: "src/content/grants/team-grants.mdx"
        format: "frontmatter"
        fields:
          - { label: "Audience label", name: "audience", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
          - { label: "CTA label", name: "cta_label", widget: "string" }

      - name: "grants_scholarships"
        label: "Senior Scholarships"
        file: "src/content/grants/senior-scholarships.mdx"
        format: "frontmatter"
        fields:
          - { label: "Audience label", name: "audience", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
          - { label: "CTA label", name: "cta_label", widget: "string" }
